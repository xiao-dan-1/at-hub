services:
  at-hub:
    image: ghcr.io/xiao-dan-1/at-hub:${AT_HUB_IMAGE_TAG:-latest}
    # The production host uses a restricted Docker bridge that cannot reach
    # SOCKS5 proxy endpoints. Share the host network so proxy egress follows
    # the same route as the server's verified host-level connection.
    network_mode: host
    environment:
      AT_INSPECTOR_HOST: 0.0.0.0
      AT_INSPECTOR_PORT: ${AT_HUB_PORT:-5173}
      AT_INSPECTOR_PROXY: ${AT_INSPECTOR_PROXY:-}
      AT_INSPECTOR_PROXY_MODE: ${AT_INSPECTOR_PROXY_MODE:-fixed}
      AT_INSPECTOR_SUBSCRIPTION_CONCURRENCY: ${AT_INSPECTOR_SUBSCRIPTION_CONCURRENCY:-10}
      AT_INSPECTOR_LIVE_CONCURRENCY: ${AT_INSPECTOR_LIVE_CONCURRENCY:-10}
      AT_INSPECTOR_UPSTREAM_TIMEOUT_MS: ${AT_INSPECTOR_UPSTREAM_TIMEOUT_MS:-12000}
      AT_INSPECTOR_IP_TIMEOUT_MS: ${AT_INSPECTOR_IP_TIMEOUT_MS:-4000}
      AT_INSPECTOR_BODY_LIMIT_BYTES: ${AT_INSPECTOR_BODY_LIMIT_BYTES:-8388608}
    restart: unless-stopped
