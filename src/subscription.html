<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; font-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <title>ChatGPT 订阅查询 · AT Hub</title>
</head>
<body class="subscription-page">
  <a class="skip-link" href="#subscriptionInput">跳到订阅查询输入框</a>

  <header class="app-bar">
    <div class="app-bar__inner">
      <div class="app-bar__primary">
        <a class="brand" href="/" aria-label="AT Hub 首页">
          <span class="brand__mark" aria-hidden="true"><i data-lucide="shield-check"></i></span>
          <span>AT Hub</span>
        </a>
        <nav class="tool-nav" aria-label="AT 工具" data-tool-navigation data-current-page="subscription"></nav>
      </div>
      <div class="local-status">
        <span class="local-status__dot" aria-hidden="true"></span>
        <span>本地服务 · 会联网</span>
      </div>
    </div>
  </header>

  <main id="top" class="app-shell subscription-shell">
    <section class="subscription-hero" aria-labelledby="subscriptionHeading">
      <div>
        <h1 id="subscriptionHeading">ChatGPT 订阅查询</h1>
        <p>批量查看套餐、试用资格与有效期。</p>
      </div>
    </section>

    <section class="input-surface subscription-query" aria-label="订阅查询输入">
      <div class="subscription-query__heading">
        <label class="subscription-label" for="subscriptionInput">粘贴 AT</label>
        <span class="query-privacy" title="请求由本机服务联网查询，不保存原始 AT">不保存输入</span>
      </div>
      <textarea
        id="subscriptionInput"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        wrap="off"
        placeholder="每行一个 AT；也支持 session JSON 或 email----pwd----2fa----at"
      ></textarea>
      <div class="input-actions">
        <button id="subscriptionRunButton" class="button button--primary" type="button">
          <i data-lucide="radar" aria-hidden="true"></i><span>查询</span>
        </button>
        <button id="subscriptionClearButton" class="button button--secondary" type="button">
          <i data-lucide="trash-2" aria-hidden="true"></i><span>清空</span>
        </button>
        <button id="subscriptionIpButton" class="button button--secondary" type="button">
          <i data-lucide="globe" aria-hidden="true"></i><span>出口国家</span>
        </button>
        <span id="subscriptionIpStatus" class="ip-inline-status" aria-live="polite" hidden></span>
        <span id="subscriptionStatus" class="keyboard-hint" aria-live="polite"></span>
      </div>
      <div id="subscriptionError" class="error-box" role="alert" hidden></div>
    </section>

    <section id="subscriptionResult" class="subscription-result" aria-live="polite" hidden></section>
  </main>
  <script type="module" src="/subscription.js"></script>
</body>
</html>
