<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; font-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f2f5f3;
      --surface: #ffffff;
      --surface-subtle: #f8faf9;
      --text: #17211c;
      --muted: #647169;
      --line: #d9e1dc;
      --accent: #087f5b;
      --accent-strong: #056647;
      --accent-soft: #e3f5ed;
      --warning: #8b5707;
      --warning-soft: #fff5df;
      --danger: #b42318;
      --danger-soft: #fff0ee;
      --shadow: 0 22px 60px rgba(31, 48, 39, 0.1);
      --radius: 20px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: var(--bg);
    }
    button, textarea { font: inherit; }
    button { color: inherit; }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 14px;
      color: white;
      background: var(--accent-strong);
      border-radius: 10px;
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: translateY(0); }
    .app-shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 44px; }
    .hero { max-width: 760px; margin-bottom: 32px; }
    h1 { margin: 0; font-size: clamp(2.45rem, 7vw, 4.2rem); line-height: 1; letter-spacing: -0.055em; }
    h2 { margin: 0; font-size: 1.35rem; letter-spacing: -0.025em; }
    .hero-copy { max-width: 680px; margin: 18px 0; color: var(--muted); font-size: 1.04rem; line-height: 1.75; }
    .local-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border: 1px solid rgba(8, 127, 91, 0.2);
      border-radius: 13px;
      font-size: 0.87rem;
      font-weight: 750;
    }
    .local-badge span { font-size: 0.58rem; }
    .unverified-label { margin: 0; color: var(--muted); font-size: 0.88rem; font-weight: 700; }
    .panel {
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      padding: 18px;
      color: var(--text);
      background: var(--surface-subtle);
      border: 1px solid var(--line);
      border-radius: 15px;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.65;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(8, 127, 91, 0.13); }
    .input-help, footer { color: var(--muted); font-size: 0.88rem; line-height: 1.65; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 18px; }
    .button {
      min-height: 44px;
      padding: 10px 17px;
      border: 1px solid transparent;
      border-radius: 11px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 760;
    }
    .button.primary { color: white; background: var(--accent); }
    .button.primary:hover { background: var(--accent-strong); }
    .button.secondary { background: transparent; border-color: var(--line); }
    .button.secondary:hover { background: rgba(127, 145, 135, 0.1); }
    .button.compact { min-height: 36px; padding: 7px 11px; font-size: 0.82rem; }
    .shortcut { margin-left: auto; color: var(--muted); font-size: 0.8rem; }
    .message { margin-top: 16px; padding: 13px 15px; border-radius: 12px; line-height: 1.55; }
    .message.error { color: var(--danger); background: var(--danger-soft); border: 1px solid rgba(180, 35, 24, 0.2); }
    .result-stack { margin-top: 42px; }
    .result-heading { margin: 0 0 18px; }
    .summary-grid, .section-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .summary-card, .claim-card {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }
    .summary-label { color: var(--muted); font-size: 0.76rem; font-weight: 760; letter-spacing: 0.08em; text-transform: uppercase; }
    .summary-value { display: block; margin-top: 8px; font-size: 1rem; font-weight: 760; overflow-wrap: anywhere; }
    .summary-card[data-state="within_window"] { border-color: rgba(8, 127, 91, 0.42); }
    .summary-card[data-state="expired"], .summary-card[data-state="not_yet_valid"] { border-color: rgba(180, 35, 24, 0.42); }
    .warning-list { display: grid; gap: 9px; margin: 14px 0; }
    .warning-item { padding: 12px 14px; color: var(--warning); background: var(--warning-soft); border-radius: 12px; line-height: 1.5; }
    .section-grid { margin-top: 14px; align-items: start; }
    .claim-card h3 { margin: 0 0 13px; font-size: 1rem; }
    .field-list { display: grid; gap: 0; margin: 0; }
    .field-row { display: grid; grid-template-columns: minmax(120px, 0.9fr) minmax(0, 1.4fr) auto; gap: 12px; align-items: start; padding: 11px 0; border-top: 1px solid var(--line); }
    .field-row:first-child { border-top: 0; }
    .field-key { color: var(--muted); font-family: "Cascadia Code", Consolas, monospace; font-size: 0.78rem; overflow-wrap: anywhere; }
    .field-value { margin: 0; font-family: "Cascadia Code", Consolas, monospace; font-size: 0.82rem; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .reveal-button { min-height: 32px; padding: 5px 9px; background: transparent; border: 1px solid var(--line); border-radius: 9px; cursor: pointer; font-size: 0.76rem; }
    .json-panel { margin-top: 14px; }
    summary { cursor: pointer; font-weight: 780; }
    .json-toolbar { display: flex; align-items: center; gap: 12px; margin: 16px 0 10px; }
    pre { max-height: 520px; margin: 0; padding: 18px; overflow: auto; background: #101713; color: #dce9e1; border-radius: 14px; font-size: 0.78rem; line-height: 1.6; }
    footer { margin-top: 24px; padding: 4px 4px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid rgba(8, 127, 91, 0.55); outline-offset: 3px; }
    [hidden] { display: none !important; }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1511;
        --surface: #17211c;
        --surface-subtle: #121b16;
        --text: #edf5f0;
        --muted: #9eaaa3;
        --line: #334139;
        --accent: #48c79b;
        --accent-strong: #76dab7;
        --accent-soft: rgba(44, 159, 120, 0.16);
        --warning: #ffc66d;
        --warning-soft: rgba(181, 111, 0, 0.16);
        --danger: #ff8d83;
        --danger-soft: rgba(180, 35, 24, 0.15);
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      }
    }

    @media (max-width: 700px) {
      .app-shell { width: min(100% - 20px, 1040px); padding-top: 38px; }
      .panel { padding: 20px; border-radius: 17px; }
      .section-heading { flex-direction: column; }
      .summary-grid, .section-grid { grid-template-columns: 1fr; }
      .field-row { grid-template-columns: 1fr auto; }
      .field-key { grid-column: 1 / -1; }
      .shortcut { width: 100%; margin-left: 0; }
    }
  </style>
  <title>AT 本地解析器</title>
</head>
<body>
  <a class="skip-link" href="#tokenInput">跳到 AT 输入框</a>
  <main class="app-shell">
    <header class="hero">
      <h1>AT 本地解析器</h1>
      <p class="hero-copy">读取 JWT Header 与 Payload，整理时间、权限和账号声明。</p>
      <div class="local-badge" role="note">
        <span aria-hidden="true">●</span>
        所有解析均在本地完成，不上传、不保存
      </div>
    </header>

    <section class="panel input-panel" aria-labelledby="inputHeading">
      <div class="section-heading">
        <div>
          <h2 id="inputHeading">粘贴一个 AT</h2>
        </div>
      </div>
      <label class="sr-only" for="tokenInput">ChatGPT access token</label>
      <textarea
        id="tokenInput"
        rows="7"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="在这里粘贴三段式 JWT；也可以包含 Bearer 前缀"
      ></textarea>
      <p class="input-help">解析成功后，输入框会立即清空。请勿把真实 token 分享到聊天、Issue 或日志中。</p>
      <div class="actions">
        <button class="button primary" id="parseButton" type="button">本地解析</button>
        <button class="button secondary" id="clearButton" type="button">清空全部</button>
        <span class="shortcut">按 Esc 随时清空</span>
      </div>
      <div id="errorBox" class="message error" role="alert" aria-live="assertive" hidden></div>
    </section>

    <section id="resultArea" class="result-stack" aria-labelledby="resultHeading" tabindex="-1" hidden>
      <div class="section-heading result-heading">
        <div>
          <h2 id="resultHeading">解析结果</h2>
        </div>
        <p class="unverified-label">已解码但未验签</p>
      </div>
      <div id="statusSummary" class="summary-grid" aria-live="polite"></div>
      <div id="warningList" class="warning-list" aria-live="polite"></div>
      <div id="sections" class="section-grid"></div>
      <details class="panel json-panel">
        <summary>查看脱敏 JSON</summary>
        <div class="json-toolbar">
          <button class="button secondary compact" id="copyButton" type="button">复制脱敏 JSON</button>
          <span id="copyStatus" aria-live="polite"></span>
        </div>
        <pre id="rawJson" tabindex="0"></pre>
      </details>
    </section>

    <footer>
      <strong>安全边界：</strong>时间状态只基于 JWT 声明和本机时钟，不能证明签名有效、凭据未撤销或服务器会接受它。
    </footer>
  </main>
  <script id="app-script">
  (() => {
    "use strict";

    class ParserError extends Error {
      constructor(code, message) {
        super(message);
        this.name = "ParserError";
        this.code = code;
      }
    }

    function normalizeInput(input) {
      return String(input ?? "")
        .trim()
        .replace(/^Bearer\s+/iu, "")
        .trim();
    }

    function decodeJsonObject(segment, label) {
      if (!/^[A-Za-z0-9_-]+={0,2}$/u.test(segment)) {
        throw new ParserError(`${label.toUpperCase()}_BASE64URL`, `${label} 不是合法的 Base64URL。`);
      }

      const unpadded = segment.replace(/=+$/u, "");
      if (unpadded.length % 4 === 1) {
        throw new ParserError(`${label.toUpperCase()}_BASE64URL`, `${label} 不是合法的 Base64URL。`);
      }

      const standard = unpadded.replace(/-/gu, "+").replace(/_/gu, "/");
      const padded = standard.padEnd(Math.ceil(standard.length / 4) * 4, "=");
      let binary;

      try {
        binary = atob(padded);
      } catch {
        throw new ParserError(`${label.toUpperCase()}_BASE64URL`, `${label} 不是合法的 Base64URL。`);
      }

      const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
      let text;

      try {
        text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch {
        throw new ParserError(`${label.toUpperCase()}_UTF8`, `${label} 不是合法的 UTF-8 文本。`);
      }

      let value;
      try {
        value = JSON.parse(text);
      } catch {
        throw new ParserError(`${label.toUpperCase()}_JSON`, `${label} 不是合法的 JSON。`);
      }

      if (value === null || Array.isArray(value) || typeof value !== "object") {
        throw new ParserError(`${label.toUpperCase()}_NOT_OBJECT`, `${label} 顶层必须是 JSON 对象。`);
      }

      return value;
    }

    const COMMON_SIGNING_ALGORITHMS = new Set([
      "RS256", "RS384", "RS512",
      "PS256", "PS384", "PS512",
      "ES256", "ES384", "ES512",
      "EdDSA",
      "HS256", "HS384", "HS512",
    ]);

    function parseNumericDate(payload, key) {
      if (!Object.prototype.hasOwnProperty.call(payload, key)) {
        return { key, present: false, valid: false, raw: undefined };
      }

      const raw = payload[key];
      if (typeof raw !== "number" || !Number.isFinite(raw)) {
        return { key, present: true, valid: false, raw };
      }

      const milliseconds = raw * 1000;
      const beijing = formatBeijingTime(raw);
      if (!Number.isFinite(milliseconds) || beijing === null) {
        return { key, present: true, valid: false, raw };
      }

      return {
        key,
        present: true,
        valid: true,
        raw,
        milliseconds,
        beijing,
      };
    }

    function formatBeijingTime(seconds) {
      if (typeof seconds !== "number" || !Number.isFinite(seconds)) {
        return null;
      }

      const shifted = new Date(seconds * 1000 + 8 * 60 * 60 * 1000);
      if (Number.isNaN(shifted.getTime())) {
        return null;
      }

      return `${shifted.toISOString().slice(0, 19).replace("T", " ")} +08:00`;
    }

    function evaluateTimeStatus(payload, nowMilliseconds = Date.now()) {
      const claims = {
        iat: parseNumericDate(payload, "iat"),
        nbf: parseNumericDate(payload, "nbf"),
        exp: parseNumericDate(payload, "exp"),
      };
      const invalidClaims = Object.values(claims)
        .filter((claim) => claim.present && !claim.valid)
        .map((claim) => claim.key);

      if (claims.nbf.valid && nowMilliseconds < claims.nbf.milliseconds) {
        return { code: "not_yet_valid", label: "尚未生效", claims, invalidClaims };
      }
      if (claims.exp.valid && nowMilliseconds >= claims.exp.milliseconds) {
        return { code: "expired", label: "已过期", claims, invalidClaims };
      }
      if (claims.nbf.valid || claims.exp.valid) {
        return { code: "within_window", label: "在声明时间窗口内", claims, invalidClaims };
      }
      return { code: "missing_time", label: "缺少时间声明", claims, invalidClaims };
    }

    function buildWarnings(header, time) {
      const warnings = [{
        code: "SIGNATURE_UNVERIFIED",
        message: "只完成了本地解码，未验证签名、撤销状态或服务器可用性。",
      }];
      const algorithm = typeof header.alg === "string" ? header.alg : "";

      if (!algorithm) {
        warnings.push({ code: "MISSING_ALG", message: "Header 缺少 alg 字段。" });
      } else if (algorithm.toLowerCase() === "none") {
        warnings.push({ code: "ALG_NONE", message: "alg=none 不提供签名保护。" });
      } else if (!COMMON_SIGNING_ALGORITHMS.has(algorithm)) {
        warnings.push({ code: "UNKNOWN_ALG", message: `算法 ${algorithm} 不在常见签名算法列表中。` });
      }

      for (const key of time.invalidClaims) {
        warnings.push({
          code: "INVALID_TIME_CLAIM",
          message: `${key} 不是有效的 JWT NumericDate 数字。`,
        });
      }

      if (time.code === "expired") {
        warnings.push({ code: "TOKEN_EXPIRED", message: "根据本机时间，该 token 已经过期。" });
      } else if (time.code === "not_yet_valid") {
        warnings.push({ code: "TOKEN_NOT_YET_VALID", message: "根据本机时间，该 token 尚未生效。" });
      } else if (time.code === "missing_time") {
        warnings.push({ code: "MISSING_TIME", message: "Payload 缺少有效的 nbf 和 exp 时间声明。" });
      }

      return warnings;
    }

    const SECTION_DEFINITIONS = [
      { id: "identity", title: "账号与身份" },
      { id: "authentication", title: "认证信息" },
      { id: "permissions", title: "权限" },
      { id: "time", title: "时间" },
      { id: "security", title: "安全信息" },
      { id: "other", title: "其他字段" },
    ];

    function isSensitiveKey(key) {
      const normalized = String(key).toLowerCase();
      if (["email", "name", "sub", "jti", "session_id"].includes(normalized)) {
        return true;
      }
      return /(?:^|_)(?:id|ids)$/u.test(normalized);
    }

    function redactDeep(value, key = "") {
      if (isSensitiveKey(key)) {
        if (Array.isArray(value)) {
          return value.map(() => "[REDACTED]");
        }
        return "[REDACTED]";
      }

      if (Array.isArray(value)) {
        return value.map((item) => redactDeep(item));
      }
      if (value !== null && typeof value === "object") {
        return Object.fromEntries(
          Object.entries(value).map(([childKey, childValue]) => [
            childKey,
            redactDeep(childValue, childKey),
          ]),
        );
      }
      return value;
    }

    function flattenEntries(value, path = [], output = []) {
      const key = path.at(-1) ?? "";
      const sensitive = isSensitiveKey(key);
      const isObject = value !== null && typeof value === "object";
      const isPrimitiveArray = Array.isArray(value)
        && value.every((item) => item === null || typeof item !== "object");

      if (!isObject || sensitive || isPrimitiveArray || Object.keys(value).length === 0) {
        output.push({
          key,
          path: path.join("."),
          sensitive,
          value,
        });
        return output;
      }

      for (const [childKey, childValue] of Object.entries(value)) {
        flattenEntries(childValue, [...path, childKey], output);
      }
      return output;
    }

    function categorizeEntry(entry) {
      const key = entry.key.toLowerCase();
      const path = entry.path.toLowerCase();

      if (["iat", "nbf", "exp"].includes(key)) {
        return "time";
      }
      if (key === "scp" || key.includes("scope") || key.includes("permission")) {
        return "permissions";
      }
      if (path.startsWith("header.") || ["iss", "aud", "client_id"].includes(key)) {
        return "security";
      }
      if (["amr", "email_verified", "is_signup", "pwd_auth_time", "sl"].includes(key)
        || path.includes(".auth.")) {
        return "authentication";
      }
      if (entry.sensitive
        || path.includes("profile")
        || key.includes("plan")
        || key.includes("residency")
        || key.includes("user")
        || key.includes("account")
        || key.includes("organization")
        || key.includes("workspace")) {
        return "identity";
      }
      return "other";
    }

    function buildSections(header, payload) {
      const entries = [
        ...flattenEntries(header, ["header"]),
        ...flattenEntries(payload, ["payload"]),
      ];

      return SECTION_DEFINITIONS.map((definition) => ({
        ...definition,
        entries: entries.filter((entry) => categorizeEntry(entry) === definition.id),
      }));
    }

    function parseJwt(input, nowMilliseconds = Date.now()) {
      const normalized = normalizeInput(input);
      if (!normalized) {
        throw new ParserError("EMPTY_INPUT", "请输入一个 AT。数据只会在当前页面内解析。");
      }

      const parts = normalized.split(".");
      if (parts.length !== 3 || parts.some((part) => part.length === 0)) {
        throw new ParserError("JWT_STRUCTURE", "AT 必须是由两个点分隔的三段式 JWT。");
      }

      const header = decodeJsonObject(parts[0], "Header");
      const payload = decodeJsonObject(parts[1], "Payload");
      const time = evaluateTimeStatus(payload, nowMilliseconds);
      const warnings = buildWarnings(header, time);
      const otherSection = buildSections(header, payload)
        .find((section) => section.id === "other");

      if (otherSection.entries.length > 0) {
        warnings.push({
          code: "UNKNOWN_CLAIMS",
          message: `发现 ${otherSection.entries.length} 个未分类声明，已保留在“其他字段”中。`,
        });
      }

      return {
        header,
        payload,
        signature: { present: true, verified: false },
        time,
        warnings,
      };
    }

    globalThis.ATParserCore = Object.freeze({
      ParserError,
      buildSections,
      buildWarnings,
      categorizeEntry,
      decodeJsonObject,
      evaluateTimeStatus,
      flattenEntries,
      formatBeijingTime,
      isSensitiveKey,
      normalizeInput,
      parseJwt,
      parseNumericDate,
      redactDeep,
    });
  })();
  </script>
</body>
</html>
